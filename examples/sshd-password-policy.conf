# /etc/ssh/sshd_config.d/10-password-policy.conf
# Keys everywhere; passwords only from the private network.
# 100.64.0.0/10 is the carrier-grade NAT range Tailscale assigns to nodes.
PasswordAuthentication no

Match Address 100.64.0.0/10
    PasswordAuthentication yes

# Apply safely:
#   sudo sshd -t && sudo systemctl reload ssh      (reload, not restart)
# Roll back:
#   sudo rm /etc/ssh/sshd_config.d/10-password-policy.conf && sudo systemctl reload ssh
